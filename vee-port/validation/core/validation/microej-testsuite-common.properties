# ArrayCopyPerformance benchmark (System.arraycopy throughput). See the README for what these
# options do and how to configure a throughput threshold. Four figures are measured: aligned and
# misaligned copies between the two buffers, plus two overlapping copies within a single buffer
# (destination shifted one byte right, then one byte left). Thresholds are unset (the checks are
# no-ops); set all four to enforce a regression threshold once the board's baseline is known.
#
# The thresholds are regression floors only: they say nothing about whether the port reaches the
# hardware's potential. The measured throughputs must also be compared against the theoretical memory
# bandwidth the silicon vendor advertises for the backing memory (the RAM bandwidth figures in the
# datasheet or reference manual) to confirm the port reaches the expected fraction of peak.
#
# Buffer size is left to the test default (64 KB, see ArrayCopyPerformance.DEFAULT_BUFFER_SIZE);
# uncomment to override.
#microej.java.property.com.microej.core.tests.arraycopy.buffer.size.bytes=65536
#microej.java.property.com.microej.core.tests.arraycopy.min.throughput.mbps=
#microej.java.property.com.microej.core.tests.arraycopy.min.throughput.misaligned.mbps=
#microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.right.mbps=
#microej.java.property.com.microej.core.tests.arraycopy.min.throughput.overlap.left.mbps=
